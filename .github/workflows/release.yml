name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  studio:
    name: Build Studio
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - name: Build Studio assets
        run: ./build/studio.sh

      - name: Upload Studio assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-dist
          path: internal/studio/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: studio
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel, archive: tar.gz }
          - { goos: darwin,  goarch: arm64, runner: macos-15,       archive: tar.gz }
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04,   archive: tar.gz }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04,   archive: tar.gz }
          - { goos: windows, goarch: amd64, runner: windows-2025,   archive: zip    }
          - { goos: windows, goarch: arm64, runner: windows-2025,   archive: zip    }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Studio assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-dist
          path: internal/studio/dist

      - name: Test
        run: go test ./...

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          bin=koda
          [ "$GOOS" = "windows" ] && bin=koda.exe
          go build -buildvcs=true -trimpath -ldflags="-s -w" -o "dist/$bin" ./cmd/koda

      - name: Smoke test
        if: (matrix.goarch == 'amd64' && runner.arch == 'X64') || (matrix.goarch == 'arm64' && runner.arch == 'ARM64')
        shell: bash
        run: |
          bin=koda
          [ "${{ matrix.goos }}" = "windows" ] && bin=koda.exe
          ./dist/$bin --help

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          package="koda_$GITHUB_REF_NAME_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${package}"
          cp dist/koda README.md README_zh-CN.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $package = "koda_$env:GITHUB_REF_NAME_${{ matrix.goos }}_${{ matrix.goarch }}"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item dist/koda.exe, README.md, README_zh-CN.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koda-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/koda_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: koda-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
          else
            tag_notes=$(git tag --list "$GITHUB_REF_NAME" --format='%(contents:body)')
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --generate-notes \
              --notes "$tag_notes" \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
