name: Studio

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/studio.yml"
      - "studio/**"
      - "proto/**"
      - "buf.gen.yaml"
      - "buf.yaml"
      - "build/studio.sh"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir studio install --frozen-lockfile

      - name: Type-check
        run: pnpm --dir studio typecheck

      - name: Lint
        run: pnpm --dir studio lint

      - name: Test
        run: pnpm --dir studio test

      - name: Build embedded assets
        run: ./build/studio.sh

      - name: Check formatting
        run: pnpm --dir studio format:check
