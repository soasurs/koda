name: Go

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/go.yml"
      - "cmd/**"
      - "gen/**"
      - "internal/**"
      - "proto/**"
      - "buf.gen.yaml"
      - "buf.yaml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Go
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare Studio test assets
        run: |
          mkdir -p internal/studio/dist
          cp internal/studio/testdata/index.html internal/studio/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...


