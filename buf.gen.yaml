version: v2

clean: true

plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative
      - simple
  - local: [pnpm, --dir, studio, exec, protoc-gen-es]
    out: studio/src/gen
    opt:
      - target=ts

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/soasurs/koda/gen

inputs:
  - directory: proto
